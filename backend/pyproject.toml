[project]
name = "global-development-agent-backend"
version = "0.1.0"
description = "Local backend for the Global Development Intelligence Agent MVP"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.4.3",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "openai==2.14.0",
  "openai-agents==0.6.4",
  "pydantic-settings==2.10.1",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

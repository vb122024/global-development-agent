name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/pip install -e 'backend[dev]'
      - run: backend/.venv/bin/python scripts/bootstrap_data.py
      - run: backend/.venv/bin/python -m pytest -q backend/tests
      - run: backend/.venv/bin/python evals/run_offline.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run test:sites --prefix frontend
